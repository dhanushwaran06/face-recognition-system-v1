<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>

</head>
<body>

    <div class="container">
        <h2 class="text-center mt-4">🔍 Search Student</h2>

        <form id="searchStudentForm">
            <div class="mb-3">
                <label class="form-label">Upload Image:</label>
                <input type="file" id="searchImage" class="form-control" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-success w-100">🔎 Find Student</button>
        </form>

        <div id="result" class="mt-3"></div>

        <div class="mt-4 text-center">
            <a href="index.html" class="btn btn-outline-primary">🏠 Home</a>
            <a href="list.html" class="btn btn-outline-info">📜 List Students</a>
        </div>
    </div>

</body>
</html>
